<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoxScan — Nouveau Scan</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', -apple-system, Arial, sans-serif; background: #0a0c10; color: #d0d0d0; padding: 30px; }
        .container { max-width: 700px; margin: auto; }
        .back { color: #666; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 20px; }
        .back:hover { color: #aaa; }
        h1 { color: #00c853; font-size: 28px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .info-box { background: #0d1a2a; border: 1px solid #1a2a3a; border-radius: 10px; padding: 20px; margin-bottom: 24px; }
        .info-box h3 { color: #2979ff; font-size: 14px; margin-bottom: 12px; }
        .info-box code { display: block; background: #0a0c10; padding: 8px 12px; border-radius: 4px; margin: 4px 0; font-size: 13px; color: #aaa; }
        .info-box code span { color: #ff9100; }
        form { background: #14171e; padding: 30px; border-radius: 12px; border: 1px solid #1e2128; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #888; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.5px; }
        .form-group input, .form-group select {
            width: 100%; padding: 14px 16px; background: #0a0c10;
            border: 1px solid #1e2128; border-radius: 8px; color: #e0e0e0;
            font-size: 15px; transition: all 0.2s;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #00c853; box-shadow: 0 0 0 3px rgba(0,200,83,0.15); }
        .form-group select option { background: #14171e; }
        .btn {
            width: 100%; padding: 16px; background: #00c853; border: none;
            border-radius: 8px; color: #000; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: #00e676; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,200,83,0.3); }
        .error { background: #2a1a1a; border: 1px solid #3a1a1a; color: #ff1744; padding: 14px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Retour au tableau de bord</a>
        <h1>Nouveau Scan</h1>
        <p class="subtitle">Analyse de sécurité complète de votre cible</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="info-box">
            <h3>Exemples de cibles</h3>
            <code><span>Site web :</span> https://exemple.com</code>
            <code><span>Domaine :</span> exemple.com</code>
            <code><span>IP :</span> 192.168.1.1</code>
        </div>
        <form method="POST">
            <div class="form-group">
                <label>Cible (IP, domaine ou URL)</label>
                <input type="text" name="target" placeholder="exemple.com" required autofocus>
            </div>
            <div class="form-group">
                <label>Type de scan</label>
                <select name="type">
                    <option value="full">Complet (recommandé) — ports + web + vulnérabilités</option>
                    <option value="quick">Rapide — top 100 ports</option>
                    <option value="web">Web uniquement — SQLi, XSS, LFI, headers</option>
                    <option value="network">Réseau uniquement — scan de ports</option>
                    <option value="all_ports">Tous les ports (65535) — lent mais exhaustif</option>
                    <option value="waf_bypass">Contournement WAF (Cloudflare/Cloudfront)</option>
                </select>
            </div>
            <button type="submit" class="btn">🚀 Lancer le scan</button>
        </form>
    </div>
</body>
</html>
