<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Email envoyé - NoxScan</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a1a;color:#e0e0e0;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .card{background:#12122a;border:1px solid #2a2a5a;border-radius:16px;padding:40px;max-width:500px;width:90%;text-align:center;box-shadow:0 0 40px rgba(0,255,136,0.05)}
        h1{color:#00ff88;font-size:24px;margin-bottom:16px}
        p{color:#aaa;margin-bottom:8px;line-height:1.6}
        .link-box{background:#1a1a3e;border:1px solid #2a2a5a;border-radius:8px;padding:12px;margin:16px 0;word-break:break-all}
        .link-box a{color:#00ff88;font-size:14px;text-decoration:none}
        .link-box a:hover{text-decoration:underline}
        .btn{display:inline-block;padding:12px 24px;background:#00ff88;color:#0a0a1a;border-radius:8px;text-decoration:none;font-weight:bold;margin-top:16px}
        .btn:hover{background:#00cc6a}
        .info{color:#666;font-size:12px;margin-top:16px}
    </style>
</head>
<body>
<div class="card">
    <h1>📧 Lien de réinitialisation</h1>
    <p>Un lien de réinitialisation a été généré pour <strong>{{ email }}</strong>.</p>
    <p style="color:#ffcc00;font-size:13px;margin-top:8px;">⚠️ Aucun email réel n'est envoyé (plan Render Free).</p>
    <p style="color:#aaa;margin-top:8px;">Utilisez le lien ci-dessous directement :</p>
    <div class="link-box">
        <a href="{{ reset_link }}">{{ reset_link }}</a>
    </div>
    <a href="{{ reset_link }}" class="btn">🔄 Réinitialiser le mot de passe</a>
    <div class="info">Ce lien expire dans 1 heure.</div>
</div>
</body>
</html>
