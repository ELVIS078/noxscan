<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nouveau mot de passe - NoxScan</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a1a;color:#e0e0e0;display:flex;justify-content:center;align-items:center;min-height:100vh}.card{background:#12122a;border:1px solid #2a2a5a;border-radius:16px;padding:40px;max-width:450px;width:90%;box-shadow:0 0 40px rgba(0,255,136,0.05)}h1{color:#00ff88;font-size:24px;margin-bottom:24px;text-align:center}label{display:block;color:#8888aa;margin-bottom:6px;font-size:14px}input[type=password]{width:100%;padding:12px;background:#1a1a3e;border:1px solid #2a2a5a;border-radius:8px;color:#e0e0e0;font-size:15px;margin-bottom:16px}input:focus{outline:none;border-color:#00ff88}button{width:100%;padding:12px;background:#00ff88;color:#0a0a1a;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}button:hover{background:#00cc6a}.error{color:#ff4444;margin-bottom:12px;padding:10px;background:#2a0a0a;border-radius:8px;text-align:center}</style></head>
<body>
<div class="card">
<h1>🔑 Nouveau mot de passe</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
<label>Nouveau mot de passe</label>
<input type="password" name="new_password" placeholder="Minimum 6 caractères" required>
<label>Confirmer le mot de passe</label>
<input type="password" name="confirm_password" placeholder="Repeat" required>
<button type="submit">Réinitialiser</button>
</form>
</div>
</body>
</html>
